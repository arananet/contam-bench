description: |
  Establish a low-friction, auditable protocol for independent reviewers to
  reproduce CONTAM-Bench evidence and report positive, negative, or incomplete
  attempts without changing frozen artifacts. The protocol makes environment,
  commit, scenario/configuration scope, commands, outputs, hashes, deviations,
  and reviewer independence explicit so a filed report becomes evidence of
  validation rather than an informal testimonial.

acceptance_criteria:
  - "A reviewer can follow docs/REPRODUCTION.md from a fresh checkout and identify prerequisites, a minimal smoke run, a full validation run, and the expected artifact outputs."
  - "GitHub provides a reproduction-report issue template that requires the tested commit, environment, commands, scope, outcome, artifact paths or hashes, and deviations."
  - "The protocol distinguishes independent external reproduction from maintainer reruns and records negative or incomplete attempts without treating them as successful validation."
  - "The protocol requires raw artifacts to remain append-only and forbids secrets, API keys, or unreviewed personal data in reports."
  - "The repository OpenSpec check and the existing pytest suite pass after the protocol is added."

test_plan:
  - "Run scripts/openspec check and verify the new spec is valid."
  - "Validate the issue-template YAML parses and contains required fields for independence, commit, environment, scope, commands, outcome, evidence, and deviations."
  - "Run pytest to ensure the documentation and issue-template additions do not regress the existing pipeline."

qa_notes: |
  Review the protocol manually from a clean clone. Do not claim an external
  reproduction until a person or environment independent of the development
  run has filed a completed report. A failed prerequisite check is a useful
  negative finding and must remain visible.

out_of_scope:
  - "Recruiting reviewers or promising that a third party will reproduce the study."
  - "Changing frozen evidence, historical verdicts, scenarios, metrics, or paper claims."
  - "Adding credentials, automatic API execution, or automatic acceptance of reviewer reports."

implementation_skill: null
eval_plan:
  scenarios: []
  metrics: []

technical_notes: |
  The issue form is intentionally evidence-oriented rather than a generic bug
  report. It should support partial attempts and record sha256 values only for
  artifacts actually produced by the reviewer. The protocol should remain
  compatible with the existing evidence/, runs/, spec/run-meta.schema.yaml,
  and docs/ADJUDICATION.md surfaces.

