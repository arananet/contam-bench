  product_owner: null  # Who approves the spec (draft → approved)

description: |
  Provide a parallel, double-blind PALM workshop manuscript derived from the
  canonical v3 paper without changing that canonical source or publishing a
  review copy in the repository.

acceptance_criteria:
  - "paper/palm-submission contains an independently compilable NeurIPS 2026 double-blind manuscript and bibliography."
  - "The manuscript uses neurips_2026 in double-blind workshop mode without the final option."
  - "The manuscript and bibliography contain no author name, repository owner, COGNITION.md, or canonical repository URL."
  - "The body retains the abstract, empirical results including Tables 3--5, and the contract-level architecture; taxonomy detail and discussion subsections are in an appendix."
  - "The generated PDF remains ignored and is not committed."

test_plan:
  - "Compile the manuscript with the repository-local NeurIPS 2026 style and inspect the TeX log for errors."
  - "Search main.tex and references.bib for author-identifying strings and canonical repository URLs."
  - "Inspect the PDF title page and verify the body page count is at most nine."

qa_notes: |
  The public anonymous-repository snapshot must be created and its URL
  independently verified before uploading the submission. The snapshot service
  was not reachable from the implementation environment, so no placeholder URL
  is included in the manuscript.

out_of_scope:
  - "Publishing a PDF or source archive before the notification date."
  - "Changing the canonical v3 manuscript."

